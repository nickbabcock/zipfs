name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  check:
    name: ${{ github.event_name == 'schedule' && 'Nightly check' || 'Check' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  build:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x86_64-gnu
          - target: x86_64-unknown-linux-musl
            platform: linux-x86_64-musl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }} --bin zipfs
      - name: Package distribution
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          IDENTIFIER: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
        run: |
          package="zipfs-${IDENTIFIER}-${PLATFORM}"
          mkdir -p "dist/${package}"
          install -m 0755 "target/${TARGET}/release/zipfs" "dist/${package}/zipfs"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (cd dist && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || format('nightly-{0}', github.sha) }}-${{ matrix.platform }}
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
